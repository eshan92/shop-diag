<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
@font-face { font-family: 'Noto Sans Sinhala'; font-weight: 400; font-style: normal;
  src: url(../assets/fonts/noto-sans-sinhala-sinhala-400-normal.woff2) format('woff2');
  unicode-range: U+0964-0965, U+0D81-0DF4, U+1CF2, U+200C-200D, U+25CC, U+111E1-111F4; }
@font-face { font-family: 'Noto Sans Sinhala'; font-weight: 700; font-style: normal;
  src: url(../assets/fonts/noto-sans-sinhala-sinhala-700-normal.woff2) format('woff2');
  unicode-range: U+0964-0965, U+0D81-0DF4, U+1CF2, U+200C-200D, U+25CC, U+111E1-111F4; }
@font-face { font-family: 'Noto Sans Sinhala'; font-weight: 800; font-style: normal;
  src: url(../assets/fonts/noto-sans-sinhala-sinhala-800-normal.woff2) format('woff2');
  unicode-range: U+0964-0965, U+0D81-0DF4, U+1CF2, U+200C-200D, U+25CC, U+111E1-111F4; }
@font-face { font-family: 'DejaVu Sans Local'; font-weight: 400;
  src: url(../assets/fonts/DejaVuSans.ttf) format('truetype'); }
@font-face { font-family: 'DejaVu Sans Local'; font-weight: 700 800;
  src: url(../assets/fonts/DejaVuSans-Bold.ttf) format('truetype'); }

:root {
  --bg: #0D0D0D; --accent: #E50914; --text: #FFFFFF; --muted: #B0B0B0;
  --u: 10.8px;
  --font: 'Noto Sans Sinhala', 'DejaVu Sans Local', 'DejaVu Sans', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }

#grid { position: absolute; inset: -10%; opacity: .55;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: calc(var(--u) * 8) calc(var(--u) * 8); }
#glow { position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--accent2, var(--accent)) 30%, transparent) 0%, transparent 60%); }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.78) 100%); }

/* content area between the channel tag and the subtitle zone */
#area { position: absolute; left: 6%; right: 6%; }
.scene { position: absolute; inset: 0; display: none; will-change: transform, opacity; }
.content { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: calc(var(--u) * 3); }
.icon { flex: 0 0 auto; width: var(--icon); height: var(--icon); color: var(--accent); }
.icon svg { width: 100%; height: 100%; overflow: visible; display: block; }
.headline { font-weight: 800; line-height: 1.38; max-width: 100%; overflow-wrap: break-word;
  text-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 2) rgba(0,0,0,.6); }
.headline .w { display: inline; }
.headline .hl { color: var(--accent); }
.sub { font-weight: 700; color: var(--muted); line-height: 1.45; max-width: 100%; }
.note { font-weight: 700; color: var(--accent); line-height: 1.4; max-width: 100%;
  padding: calc(var(--u) * .6) calc(var(--u) * 2.2); border-left: calc(var(--u) * .7) solid var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: calc(var(--u) * .6); }
.final { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.5); }
.sources { color: var(--muted); font-weight: 400; line-height: 1.4; }
.subscribe { display: inline-flex; align-items: center; gap: .55em; background: var(--accent); color: #fff;
  font-weight: 800; padding: .55em 1.3em; border-radius: .5em; letter-spacing: .04em;
  box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 3) color-mix(in srgb, var(--accent) 55%, transparent); }
.subscribe svg { height: 1.05em; width: 1.05em; }

#tag { position: absolute; display: flex; align-items: center; gap: calc(var(--u) * 1.2);
  font-weight: 700; color: var(--text); white-space: nowrap; max-width: 80%;
  background: rgba(0,0,0,.45); border-radius: calc(var(--u) * .6);
  padding: calc(var(--u) * .7) calc(var(--u) * 1.6) calc(var(--u) * .7) calc(var(--u) * 1); }
#tag i { display: block; width: calc(var(--u) * .8); align-self: stretch; background: var(--accent);
  border-radius: calc(var(--u) * .3); }
#tag span { overflow: hidden; text-overflow: ellipsis; }

#subs { position: absolute; left: 5%; right: 5%; display: flex; justify-content: center; }
#subs span { display: none; text-align: center; font-weight: 700; line-height: 1.45;
  background: rgba(0,0,0,.72); color: #fff; border-radius: calc(var(--u) * .8);
  padding: calc(var(--u) * .5) calc(var(--u) * 1.8); max-width: 100%;
  box-decoration-break: clone; -webkit-box-decoration-break: clone; }

#progress { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * .9);
  background: rgba(255,255,255,.12); }
#bar { height: 100%; width: 0; background: var(--accent);
  box-shadow: 0 0 calc(var(--u) * 1.5) var(--accent); }
#wipebar { position: absolute; top: 0; bottom: 0; width: calc(var(--u) * 1.2); display: none;
  background: var(--accent); box-shadow: 0 0 calc(var(--u) * 3) var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <div id="area"></div>
  <div id="wipebar"></div>
  <div id="vignette"></div>
  <div id="tag"><i></i><span></span></div>
  <div id="subs"><span></span></div>
  <div id="progress"><div id="bar"></div></div>
</div>
<script src="icons.js"></script>
<script src="engine.js"></script>
</body>
</html>
